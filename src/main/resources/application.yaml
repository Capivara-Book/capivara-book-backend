server:
    port: 8080

spring:
    application:
        name: capivara-book
    datasource:
        url: jdbc:mysql://localhost:3306/db_capivara_book?createDatabaseIfNotExist=true
        username: ${DATABASE_USERNAME}
        password: ${DATABASE_PASSWORD}
    #    driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: create-drop # update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
